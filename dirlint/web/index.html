<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dirlint — placement audit</title>
<style>
:root{
  --paper:#F4F2EB; --surface:#FBFAF5; --ink:#171A16; --muted:#5F655C;
  --line:#D6D3C6; --line-strong:#B6B3A5;
  --rust:#A6402A; --amber:#8A6118; --green:#2C5F47; --focus:#2F5EA8;
  --mono:"Cascadia Mono",Consolas,ui-monospace,SFMono-Regular,monospace;
  --sans:ui-sans-serif,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink); font:14px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button,input{font:inherit;color:inherit}
input::placeholder{color:var(--muted)}

.topbar{
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;
  padding:0 24px;min-height:64px;border-bottom:1px solid var(--line-strong);
  background:var(--surface);
}
.brand{display:flex;align-items:baseline;gap:10px;font-weight:650;letter-spacing:-.01em;font-size:17px}
.brand .mark{font-family:var(--mono);font-weight:700;color:var(--rust)}
.brand .sub{font-size:10.5px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.controls{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.root-field{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);padding:0 10px;height:34px;min-width:340px}
.root-field span{font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-weight:600;white-space:nowrap}
.root-field input{border:0;background:transparent;outline:0;width:100%;font-family:var(--mono);font-size:12.5px}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.check input{width:14px;height:14px;accent-color:var(--ink);margin:0}
.btn{height:34px;padding:0 18px;border:1px solid var(--ink);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;letter-spacing:.01em;border-radius:2px;transition:background .15s,color .15s}
.btn:hover{background:var(--ink);color:var(--surface)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:#000}
.btn[disabled]{opacity:.45;cursor:progress}
.btn.primary[disabled]:hover{background:var(--ink);color:var(--paper)}

main{max-width:1560px;margin:0 auto}
.report{
  display:flex;align-items:center;gap:28px;flex-wrap:wrap;
  padding:18px 24px;border-bottom:1px solid var(--line);
}
.stamp{
  border:1.5px solid currentColor;padding:5px 12px 4px;font-weight:700;
  font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  min-width:104px;text-align:center;border-radius:1px;
}
.stamp.clear{color:var(--green)}
.stamp.bad{color:var(--rust)}
.stats{display:flex;gap:0;margin:0}
.stats div{padding:0 18px;border-left:1px solid var(--line)}
.stats div:first-child{padding-left:0;border-left:0}
.stats dt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats dd{margin:2px 0 0;font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.meta{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}

.workspace{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 210px)}
.rail{border-right:1px solid var(--line);padding:16px 0 24px;background:var(--surface)}
.rail h2{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;padding:0 18px 10px;font-weight:650}
.rules{list-style:none;margin:0;padding:0}
.rule-btn{
  display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;
  width:100%;padding:7px 18px;border:0;background:transparent;text-align:left;
  cursor:pointer;font-size:12.5px;color:var(--ink);border-radius:0;
}
.rule-btn:hover{background:#EFEDE4}
.rule-btn .code{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.rule-btn .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule-btn .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rule-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.rule-btn[aria-pressed="true"] .code,.rule-btn[aria-pressed="true"] .n{color:#C9C6B9}
.rule-btn.zero{opacity:.45}
.rule-btn.all{padding-top:8px;padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.dot{width:6px;height:6px;display:inline-block;margin-right:6px;background:var(--muted);vertical-align:1px}
.dot.high{background:var(--rust)} .dot.medium{background:var(--amber)} .dot.low{background:var(--line-strong)}

.board{min-width:0;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line)}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-strong);padding:4px 2px}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;width:100%;font-size:13px}
.hint{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.group-head{
  display:flex;align-items:baseline;gap:10px;padding:14px 24px 6px;
  border-bottom:1px solid var(--line-strong);position:sticky;top:0;
  background:var(--paper);z-index:1;
}
.group-head .code{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.group-head .title{font-weight:650;font-size:12.5px;letter-spacing:.01em}
.group-head .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.row{
  display:grid;grid-template-columns:58px minmax(0,1fr) 300px 96px;align-items:center;
  gap:14px;width:100%;padding:10px 24px;border:0;border-bottom:1px solid var(--line);
  background:transparent;text-align:left;cursor:pointer;
}
.row:hover{background:var(--surface)}
.row .r{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.row .path{font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .why{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .size{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.detail{grid-column:2/-1;padding:2px 0 10px;display:none}
.row[aria-expanded="true"] .detail{display:block}
.row[aria-expanded="true"]{background:var(--surface)}
.detail .label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:650;margin:10px 0 2px}
.detail p{margin:0;max-width:78ch;font-size:13px}
.detail .fullpath{font-family:var(--mono);font-size:11.5px;word-break:break-all;color:var(--muted)}
.detail .actions{margin-top:10px}
.copy{height:26px;padding:0 10px;border:1px solid var(--line-strong);background:var(--paper);font-size:11.5px;cursor:pointer;border-radius:2px}
.copy:hover{border-color:var(--ink)}
.empty{padding:72px 24px;text-align:center}
.empty .word{font-size:30px;font-weight:700;letter-spacing:.18em;color:var(--green)}
.empty p{margin:8px 0 0;color:var(--muted);font-size:13.5px}
.error{margin:20px 24px;border:1px solid var(--rust);padding:12px 14px;background:#FBF1ED}
.error b{color:var(--rust)}
.error p{margin:4px 0 10px;font-size:13px;color:var(--muted)}
.skeleton{padding:0 24px}
.skeleton .bar{height:12px;background:#E7E4D9;margin:18px 0;border-radius:1px;position:relative;overflow:hidden}
.skeleton .bar::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
  animation:sweep 1.1s linear infinite;
}
.skeleton .bar:nth-child(3n){width:62%} .skeleton .bar:nth-child(4n){width:78%}
@keyframes sweep{to{transform:translateX(100%)}}
footer{
  display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  padding:12px 24px;border-top:1px solid var(--line-strong);color:var(--muted);
  font-size:11.5px;background:var(--surface);
}
footer .mono{font-family:var(--mono)}
@media (max-width:1100px){
  .row{grid-template-columns:52px minmax(0,1fr) 84px}
  .row .why{display:none}
}
@media (max-width:900px){
  .workspace{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line-strong);padding:10px 0;overflow-x:auto}
  .rail h2{display:none}
  .rules{display:flex;gap:4px;padding:0 12px;width:max-content}
  .rule-btn{width:auto;grid-template-columns:auto auto auto;gap:6px;padding:7px 10px;border:1px solid var(--line);background:var(--surface)}
  .rule-btn.all{border-bottom:1px solid var(--line);margin-bottom:0;padding:7px 10px}
  .rule-btn .name{max-width:120px}
  .report{gap:14px;padding:14px 16px}
  .meta{margin-left:0;width:100%;text-align:left}
  .topbar{padding:10px 16px;gap:12px}
  .root-field{min-width:0;flex:1}
  .toolbar{padding:10px 16px}
  .group-head{padding:12px 16px 6px}
  .row{padding:10px 16px}
  .empty{padding:56px 16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">/</span>dirlint<span class="sub" data-i18n="subtitle">placement audit</span></div>
  <div class="controls">
    <label class="root-field"><span data-i18n="root">ROOT</span><input id="root" spellcheck="false" autocomplete="off"></label>
    <label class="check"><input type="checkbox" id="dupes"><span data-i18n="dupes">find duplicates</span></label>
    <button class="btn primary" id="scan" data-i18n="scan">Scan</button>
  </div>
</header>

<main>
  <section class="report" aria-live="polite">
    <div class="stamp" id="stamp">—</div>
    <dl class="stats">
      <div><dt data-i18n="findings">findings</dt><dd id="count">—</dd></div>
      <div><dt data-i18n="reclaimable">reclaimable</dt><dd id="bytes">—</dd></div>
      <div><dt data-i18n="elapsed">elapsed</dt><dd id="time">—</dd></div>
    </dl>
    <div class="meta" id="meta">—</div>
  </section>

  <div class="workspace">
    <aside class="rail" aria-label="Rule index">
      <h2 data-i18n="ruleIndex">Rule index</h2>
      <ul class="rules" id="rules"></ul>
    </aside>

    <section class="board">
      <div class="toolbar">
        <label class="search">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
          <input id="q" data-i18n-placeholder="filter" placeholder="Filter by path, rule, or reason…">
        </label>
        <span class="hint" id="hint">/</span>
      </div>
      <ul class="list" id="list"></ul>
      <div class="skeleton" id="skeleton" hidden aria-hidden="true">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <div class="empty" id="empty" hidden>
        <div class="word" data-i18n="clear">CLEAR</div>
        <p data-i18n="clearBody">No placement violations in this scan.</p>
      </div>
      <div class="error" id="error" hidden>
        <b data-i18n="error">Scan failed</b>
        <p id="errorText"></p>
        <button class="btn" id="retry" data-i18n="retry">Retry</button>
      </div>
    </section>
  </div>
</main>

<footer>
  <span class="mono" id="version">dirlint</span>
  <span data-i18n="readonly">Read-only. Nothing was moved or deleted.</span>
  <span class="mono" style="margin-left:auto" id="stampFooter">—</span>
</footer>

<script>
const I18N = {
  en: {
    subtitle:"placement audit", root:"ROOT", dupes:"find duplicates", scan:"Scan", scanning:"Scanning…",
    held:"Held", findings:"findings", reclaimable:"reclaimable", elapsed:"elapsed", ruleIndex:"Rule index",
    filter:"Filter by path, rule, or reason…", clear:"CLEAR", clearBody:"No placement violations in this scan.",
    error:"Scan failed", retry:"Retry", readonly:"Read-only. Nothing was moved or deleted.",
    all:"All rules", why:"Why", fix:"Fix", fullpath:"Full path", copy:"Copy path", copied:"Copied",
    none:"—", zero:"0 findings",
    reasons:{
      "top.dir":"Directory is not on the top-level whitelist.",
      "top.file":"File is not on the top-level whitelist.",
      "nest":"Zone root contains a directory of its own name.",
      "rootfile":"Stray file at the project root.",
      "backup":"Backup or bare timestamp directory.",
      "tempdir":"Temporary directory inside a project zone.",
      "ws.timestamp":"Bare timestamp directory.",
      "ws.unregistered":"Directory is not registered in the workspace.",
      "retired":"Directory was declared retired.",
      "dupe":"Byte-identical copies found."
    },
    fixes:{
      "fix.top":"Move it into a configured zone, or delete it if it has no value.",
      "fix.nest":"Flatten it into the zone root.",
      "fix.rootfile":"Delete logs and backups; move real assets into docs/ or runtime-data.",
      "fix.backup":"Keep only a unique copy, archive it, and delete the rest.",
      "fix.tempdir":"Move it to the process workspace and delete the folder.",
      "fix.ws":"Archive or delete it; task folders belong in the task workspace.",
      "fix.retired":"Archive it if it is the only copy, then delete it.",
      "fix.dupe":"Delete the extra copies; keep one canonical file."
    }
  },
  zh: {
    subtitle:"落位审计", root:"根目录", dupes:"查重复文件", scan:"扫描", scanning:"扫描中…",
    held:"待处理", findings:"项违规", reclaimable:"可回收", elapsed:"耗时", ruleIndex:"规则索引",
    filter:"按路径、规则或原因筛选…", clear:"通过", clearBody:"本次扫描没有落位违规。",
    error:"扫描失败", retry:"重试", readonly:"只读扫描，未移动或删除任何文件。",
    all:"全部规则", why:"原因", fix:"建议", fullpath:"完整路径", copy:"复制路径", copied:"已复制",
    none:"—", zero:"0 项",
    reasons:{
      "top.dir":"目录不在顶层白名单内。",
      "top.file":"文件不在顶层白名单内。",
      "nest":"区内出现了与自身同名的子目录。",
      "rootfile":"项目根目录有散落文件。",
      "backup":"备份目录或纯时间戳目录。",
      "tempdir":"项目区内存在临时目录。",
      "ws.timestamp":"纯时间戳目录。",
      "ws.unregistered":"该目录未在工作区登记。",
      "retired":"该目录已宣布退役。",
      "dupe":"发现字节完全相同的副本。"
    },
    fixes:{
      "fix.top":"移入已配置的区域；没有价值就直接删除。",
      "fix.nest":"拍平到区域根目录。",
      "fix.rootfile":"日志与备份删除；真正的素材移入 docs/ 或 runtime-data。",
      "fix.backup":"只保留唯一副本并归档，其余删除。",
      "fix.tempdir":"移到过程工作区后删除该目录。",
      "fix.ws":"归档或删除；任务目录统一放任务工作区。",
      "fix.retired":"若是唯一副本先归档，再删除。",
      "fix.dupe":"删除多余副本，只留一份正本。"
    }
  }
};
const RULE_ZH = {
  R0:"顶层白名单", R1:"同名嵌套", R2:"项目根散文件", R3:"备份与时间戳目录",
  R4:"项目区临时目录", R5:"工作区结构", R6:"退役目录", R7:"重复文件"
};
const params = new URLSearchParams(location.search);
const forced = params.get("lang");
const LANG = forced === "zh" || forced === "en"
  ? forced
  : ((navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en");
const T = I18N[LANG];

const $ = (id) => document.getElementById(id);
const state = { data:null, filter:"all", query:"", expanded:new Set(), busy:false };
let ruleMeta = {};

function fmtBytes(n){
  if (!n) return "0 B";
  const u = ["B","KB","MB","GB","TB"]; let v = n, i = 0;
  while (v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
  return (i === 0 ? v.toFixed(0) : v.toFixed(1)) + " " + u[i];
}
function ruleName(id){
  if (!ruleMeta[id]) return id;
  return LANG === "zh" && RULE_ZH[id] ? RULE_ZH[id] : ruleMeta[id].title;
}
function reasonText(f){
  const key = f.reason_key;
  return (key && T.reasons[key]) || f.reason;
}
function fixText(f){
  const key = f.fix_key;
  return (key && T.fixes[key]) || f.fix;
}
function countLabel(n){
  return LANG === "zh" ? `${n} 项违规` : `${n} ${n === 1 ? "finding" : "findings"}`;
}
function el(tag, cls, text){
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function applyI18n(){
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach((node) => {
    const key = node.dataset.i18n;
    if (T[key]) node.textContent = T[key];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((node) => {
    const key = node.dataset.i18nPlaceholder;
    if (T[key]) node.placeholder = T[key];
  });
}

function setBusy(busy){
  state.busy = busy;
  const btn = $("scan");
  btn.disabled = busy;
  btn.textContent = busy ? T.scanning : T.scan;
  $("skeleton").hidden = !busy;
  if (busy){ $("list").replaceChildren(); $("empty").hidden = true; $("error").hidden = true; }
}

async function runScan(){
  if (state.busy) return;
  const root = $("root").value.trim() || ".";
  const dupes = $("dupes").checked ? "1" : "0";
  setBusy(true);
  try {
    const res = await fetch(`/api/scan?root=${encodeURIComponent(root)}&duplicates=${dupes}`);
    const payload = await res.json();
    if (!res.ok) throw new Error(payload.error || res.statusText);
    state.data = payload;
    ruleMeta = payload.ruleMeta || {};
    state.expanded.clear();
    render();
  } catch (err) {
    $("errorText").textContent = String(err.message || err);
    $("error").hidden = false;
    $("stamp").textContent = T.none;
    $("stamp").className = "stamp";
  } finally {
    setBusy(false);
  }
}

function visibleFindings(){
  if (!state.data) return [];
  const q = state.query.toLowerCase();
  return state.data.findings.filter((f) => {
    if (state.filter !== "all" && f.rule !== state.filter) return false;
    if (!q) return true;
    return (f.rel + " " + reasonText(f) + " " + f.rule + " " + ruleName(f.rule)).toLowerCase().includes(q);
  });
}

function render(){
  if (!state.data) return;
  const { summary, findings } = state.data;
  const clean = summary.count === 0;
  const stamp = $("stamp");
  stamp.textContent = clean ? T.clear : T.held;
  stamp.className = "stamp " + (clean ? "clear" : "bad");
  $("count").textContent = String(summary.count);
  $("bytes").textContent = fmtBytes(summary.bytes);
  $("time").textContent = `${state.data.durationMs} ms`;
  $("meta").textContent = new Date(state.data.generatedAt).toLocaleString();
  $("stampFooter").textContent = `${findings.length} / ${summary.count}`;
  $("version").textContent = "dirlint " + (state.data.version || "0.1.0");
  renderRules();
  renderList();
}

function renderRules(){
  const box = $("rules");
  box.replaceChildren();
  const counts = state.data.summary.byRule || {};
  const total = state.data.summary.count;

  const all = el("button", "rule-btn all" + (state.filter === "all" ? "" : ""));
  all.setAttribute("aria-pressed", String(state.filter === "all"));
  all.append(el("span", "code", "ALL"), el("span", "name", T.all), el("span", "n", String(total)));
  all.onclick = () => { state.filter = "all"; render(); };
  const allLi = el("li"); allLi.append(all); box.append(allLi);

  Object.keys(ruleMeta).sort().forEach((id) => {
    const meta = ruleMeta[id];
    const n = counts[id] || 0;
    const btn = el("button", "rule-btn" + (n === 0 ? " zero" : ""));
    btn.setAttribute("aria-pressed", String(state.filter === id));
    const code = el("span", "code");
    const dot = el("span", "dot " + meta.severity);
    code.append(dot, document.createTextNode(id));
    btn.append(code, el("span", "name", ruleName(id)), el("span", "n", String(n)));
    btn.title = meta.desc || "";
    btn.onclick = () => { state.filter = state.filter === id ? "all" : id; render(); };
    const li = el("li"); li.append(btn); box.append(li);
  });
}

function renderList(){
  const list = $("list");
  list.replaceChildren();
  const items = visibleFindings();
  $("hint").textContent = state.data ? `${items.length} / ${state.data.summary.count}` : "/";
  $("empty").hidden = items.length !== 0 || state.data?.summary.count !== 0;
  if (!items.length) return;

  if (state.filter === "all" && !state.query){
    const groups = {};
    items.forEach((f) => (groups[f.rule] ||= []).push(f));
    Object.keys(groups).sort().forEach((id) => {
      const head = el("li", "group-head");
      head.append(el("span", "code", id), el("span", "title", ruleName(id)),
                  el("span", "n", countLabel(groups[id].length)));
      list.append(head);
      groups[id].forEach((f) => list.append(rowFor(f)));
    });
  } else {
    items.forEach((f) => list.append(rowFor(f)));
  }
}

function rowFor(f){
  const li = el("li");
  const btn = el("button", "row");
  const open = state.expanded.has(f.path);
  btn.setAttribute("aria-expanded", String(open));
  btn.append(el("span", "r", f.rule), el("span", "path", f.rel),
             el("span", "why", reasonText(f)), el("span", "size", fmtBytes(f.size)));

  const detail = el("div", "detail");
  const why = el("div");
  why.append(el("div", "label", T.why), el("p", null, reasonText(f)));
  const fix = el("div");
  fix.append(el("div", "label", T.fix), el("p", null, fixText(f)));
  const path = el("div");
  path.append(el("div", "label", T.fullpath), el("div", "fullpath", f.path));
  const actions = el("div", "actions");
  const copy = el("button", "copy", T.copy);
  copy.onclick = async (ev) => {
    ev.stopPropagation();
    try { await navigator.clipboard.writeText(f.path); copy.textContent = T.copied;
          setTimeout(() => (copy.textContent = T.copy), 1200); } catch { /* clipboard denied */ }
  };
  actions.append(copy);
  detail.append(why, fix, path, actions);
  btn.append(detail);
  btn.onclick = () => {
    if (state.expanded.has(f.path)) state.expanded.delete(f.path);
    else state.expanded.add(f.path);
    renderList();
  };
  li.append(btn);
  return li;
}

// init
applyI18n();
$("version").textContent = "dirlint";
$("scan").onclick = runScan;
$("retry").onclick = runScan;
$("root").addEventListener("keydown", (e) => { if (e.key === "Enter") runScan(); });
$("q").addEventListener("input", (e) => { state.query = e.target.value.trim(); renderList(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT"){
    e.preventDefault(); $("q").focus();
  }
});
fetch("/api/config").then((r) => r.json()).then((payload) => {
  $("root").value = payload.root || ".";
  runScan();
}).catch(() => { $("root").value = "."; runScan(); });
</script>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dirlint"
version = "0.1.0"
description = "Read-only placement audit for a workspace directory tree"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dirlint contributors" }]
keywords = ["lint", "filesystem", "workspace", "hygiene", "audit"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
dirlint = "dirlint.cli:main"

[tool.setuptools]
packages = ["dirlint"]

[tool.setuptools.package-data]
dirlint = ["web/*.html"]
